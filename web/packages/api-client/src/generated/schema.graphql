"""Arbitrary-precision decimal serialized as a string, e.g. "1234.56"."""
scalar Decimal

type Money {
  amount: Decimal!
  currencyCode: String!
}

enum TransactionType {
  BUY
  SELL
  DIVIDEND
  DEPOSIT
  WITHDRAWAL
  INTEREST
  FEE
  TAX
  TRANSFER_IN
  TRANSFER_OUT
  FX_CONVERSION
  SPLIT
}

input AddTransactionInput {
  type: TransactionType!
  symbol: String
  tradeDate: String!
  quantity: Decimal
  price: Decimal
  amount: Decimal
  currencyCode: String
  fee: Decimal
  feeCurrencyCode: String
  notes: String
}

type AddTransactionPayload {
  transactionId: String!
  portfolio: Portfolio!
}

type Instrument {
  id: ID!
  symbol: String!
  name: String!
  currencyCode: String!
  assetClass: String!
  exchangeCode: String!
  isin: String
  isActive: Boolean!
}

"""Trading venue reference data identified by its ISO 10383 MIC code."""
type Exchange {
  code: String!
  name: String!
  country: String!
  timezone: String!
}

type Query {
  portfolio: Portfolio!
  instruments: [Instrument!]!
  portfolioHistory(timeframe: HistoryTimeframe!): PortfolioHistory!
  transactions(type: TransactionType, symbol: String, page: Int = 1, pageSize: Int = 20): TransactionsConnection!
  allInstruments(isActive: Boolean, search: String): [Instrument!]!
  exchanges: [Exchange!]!
  instrumentPrices(symbol: String, fromDate: String, toDate: String, limit: Int = 50, offset: Int = 0): InstrumentPricesConnection!
  ingestionStatus: IngestionStatus!
  userPreferences: UserPreferences!
  supportedCurrencies: [Currency!]!
  currencyPairs: [CurrencyPair!]!
  currencyPairHistory(baseCurrency: String!, quoteCurrency: String!, timeframe: HistoryTimeframe!): CurrencyPairHistory!
  fxRates(baseCurrency: String, quoteCurrency: String, fromDate: String, toDate: String, limit: Int = 50, offset: Int = 0): FXRatesConnection!
  checkTransactionDuplicates(externalRefs: [String!]!): [String!]!
  cashFlowReport(filter: CashFlowFilterInput!): CashFlowReport!
}

enum HistoryTimeframe {
  TIMEFRAME_1D
  TIMEFRAME_1W
  TIMEFRAME_1M
  TIMEFRAME_1Y
  TIMEFRAME_ALL
}

type ValuationPoint {
  date: String!
  totalValue: Money!
  marketValue: Money!
  cashValue: Money!
  twrIndex: Decimal!
  dailyReturn: Decimal
}

type PortfolioHistory {
  points: [ValuationPoint!]!
  startValue: Money!
  endValue: Money!
  returnAmount: Money!
  returnPercent: Decimal!
}

type TransactionItem {
  id: ID!
  type: TransactionType!
  symbol: String
  instrumentName: String
  tradeDate: String!
  quantity: Decimal
  price: Money
  amount: Money!
  fee: Money!
  notes: String
  createdAt: String!
}

type TransactionsConnection {
  items: [TransactionItem!]!
  totalCount: Int!
  page: Int!
  pageSize: Int!
}

type DeleteTransactionPayload {
  success: Boolean!
  portfolio: Portfolio!
}

type DeleteInstrumentPayload {
  success: Boolean!
  id: ID!
}

type Mutation {
  addTransaction(input: AddTransactionInput!): AddTransactionPayload!
  deleteTransaction(id: ID!): DeleteTransactionPayload!
  createInstrument(input: CreateInstrumentInput!): Instrument!
  updateInstrument(input: UpdateInstrumentInput!): Instrument!
  deleteInstrument(id: ID!): DeleteInstrumentPayload!
  recordPriceOverride(input: RecordPriceOverrideInput!): RecordPriceOverridePayload!
  triggerMarketSync(symbols: [String!], syncFx: Boolean): MarketSyncPayload!
  triggerBackfill(input: TriggerBackfillInput!): BackfillPayload!
  updateUserPreferences(input: UpdateUserPreferencesInput!): UpdateUserPreferencesPayload!
  recordFXRateOverride(input: RecordFXRateOverrideInput!): RecordFXRateOverridePayload!
  importTransactions(input: BatchImportTransactionsInput!): BatchImportTransactionsPayload!
}

input ImportTransactionInput {
  externalRef: String!
  symbol: String!
  type: TransactionType!
  tradeDate: String!
  settleDate: String
  quantity: Decimal!
  price: Decimal!
  amount: Decimal!
  fee: Decimal!
  feeCurrencyCode: String
  currencyCode: String
  notes: String
}

input BatchImportTransactionsInput {
  transactions: [ImportTransactionInput!]!
  skipDuplicates: Boolean = true
}

type BatchImportTransactionsPayload {
  success: Boolean!
  importedCount: Int!
  skippedCount: Int!
  portfolio: Portfolio!
  message: String!
}

type InstrumentPrice {
  id: ID!
  symbol: String!
  priceDate: String!
  price: Money!
  source: String!
  updatedAt: String!
}

type InstrumentPricesConnection {
  items: [InstrumentPrice!]!
  totalCount: Int!
}

input CreateInstrumentInput {
  symbol: String!
  exchangeCode: String!
  name: String!
  assetClass: String!
  currencyCode: String!
  isin: String
}

input UpdateInstrumentInput {
  id: ID!
  name: String
  isActive: Boolean
  isin: String
}

input RecordPriceOverrideInput {
  symbol: String!
  priceDate: String!
  price: Decimal!
  reason: String
  recomputeValuations: Boolean
}

type RecordPriceOverridePayload {
  price: InstrumentPrice!
  valuationsRecomputed: Boolean!
}

type FeedHealthStatus {
  name: String!
  status: String!
  provider: String!
  schedule: String!
  lastRun: String!
  details: String!
}

type IngestionStatus {
  feeds: [FeedHealthStatus!]!
  trackedInstruments: Int!
  trackedCurrencies: Int!
  latestPriceDate: String
  latestFxDate: String
  rateLimitRemaining: Int!
  rateLimitBudget: Int!
  pendingBackfillJobs: Int!
}

type MarketSyncPayload {
  success: Boolean!
  pricesSynced: Int!
  fxRatesSynced: Int!
  message: String!
}

input TriggerBackfillInput {
  fromDate: String!
  toDate: String!
  symbols: [String!]
  currencyPairs: [String!]
  backfillAssets: Boolean
  backfillFx: Boolean
  recomputeValuations: Boolean
}

type BackfillPayload {
  success: Boolean!
  pricesSynced: Int!
  fxRatesSynced: Int!
  message: String!
  warnings: [String!]!
}

type Portfolio {
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  annualizedReturnPercent: Decimal!
  cashBalance: Money!
  investments: [Investment!]!
}

type Investment {
  id: ID!
  ticker: String!
  name: String!
  price: Money!
  averageBuyPrice: Money
  quantity: Decimal!
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  totalReturnAmount: Money!
  totalReturnPercent: Decimal!
  capitalGainAmount: Money!
  capitalGainPercent: Decimal!
  incomeAmount: Money!
  incomeYieldPercent: Decimal!
  currencyGainAmount: Money!
  currencyGainPercent: Decimal!
  isInternational: Boolean!
}

type UserPreferences {
  userId: ID!
  email: String!
  displayName: String!
  displayCurrency: String!
  theme: String!
  createdAt: String!
  updatedAt: String!
}

type Currency {
  code: String!
  name: String!
  symbol: String!
}

input UpdateUserPreferencesInput {
  displayName: String
  displayCurrency: String
  theme: String
}

type UpdateUserPreferencesPayload {
  preferences: UserPreferences!
  portfolio: Portfolio
}

type CurrencyPair {
  baseCurrency: String!
  quoteCurrency: String!
  pair: String!
  latestRate: Decimal!
  latestDate: String!
  latestSource: String!
  previousRate: Decimal
  change1dAmount: Decimal
  change1dPct: Decimal
  totalRecords: Int!
  firstDate: String!
  lastDate: String!
}

type FXRate {
  baseCurrency: String!
  quoteCurrency: String!
  pair: String!
  rateDate: String!
  rate: Decimal!
  invertedRate: Decimal!
  source: String!
}

type FXRatesConnection {
  items: [FXRate!]!
  totalCount: Int!
}

type FXHistoryPoint {
  date: String!
  rate: Decimal!
  invertedRate: Decimal!
  source: String!
}

type CurrencyPairHistory {
  baseCurrency: String!
  quoteCurrency: String!
  pair: String!
  points: [FXHistoryPoint!]!
  startRate: Decimal!
  endRate: Decimal!
  periodChange: Decimal!
  periodChangePct: Decimal!
  periodHigh: Decimal!
  periodLow: Decimal!
}

input RecordFXRateOverrideInput {
  baseCurrency: String!
  quoteCurrency: String!
  rateDate: String!
  rate: Decimal!
  reason: String
  recomputeValuations: Boolean
}

type RecordFXRateOverridePayload {
  rate: FXRate!
  valuationsRecomputed: Boolean!
}

enum CashFlowTimeframe {
  MTD
  YTD
  M1
  M3
  M6
  Y1
  ALL
  CUSTOM
}

enum CashFlowDirection {
  INFLOW
  OUTFLOW
}

enum CashFlowCategory {
  CAPITAL_DEPOSITS
  DIVIDENDS
  INTEREST
  SALE_PROCEEDS
  CAPITAL_WITHDRAWALS
  PURCHASES
  FEES
  TAXES
}

input CashFlowFilterInput {
  timeframe: CashFlowTimeframe!
  fromDate: String
  toDate: String
  currency: String
}

type CashFlowSummary {
  startingCashBalance: Money!
  totalInflows: Money!
  totalOutflows: Money!
  netCashFlow: Money!
  endingCashBalance: Money!
}

type CashFlowCategoryBreakdown {
  deposits: Money!
  dividends: Money!
  interest: Money!
  salesProceeds: Money!
  withdrawals: Money!
  purchases: Money!
  fees: Money!
  taxes: Money!
}

type CashFlowItem {
  id: ID!
  eventDate: String!
  type: TransactionType!
  flowDirection: CashFlowDirection!
  category: CashFlowCategory!
  symbol: String
  instrumentName: String
  description: String!
  netAmount: Money!
  runningBalance: Money!
  localAmount: Money!
  fee: Money!
  withholdingTax: Money!
}

type CashFlowReport {
  summary: CashFlowSummary!
  breakdown: CashFlowCategoryBreakdown!
  items: [CashFlowItem!]!
  baseCurrency: String!
  fromDate: String!
  toDate: String!
}