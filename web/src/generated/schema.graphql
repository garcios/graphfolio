"""Arbitrary-precision decimal serialized as a string, e.g. "1234.56"."""
scalar Decimal

type Money {
  amount: Decimal!
  currencyCode: String!
}

enum TransactionType {
  BUY
  SELL
  DIVIDEND
  DEPOSIT
  WITHDRAWAL
  INTEREST
  FEE
  TAX
  TRANSFER_IN
  TRANSFER_OUT
  FX_CONVERSION
}

input AddTransactionInput {
  type: TransactionType!
  symbol: String
  tradeDate: String!
  quantity: Decimal
  price: Decimal
  amount: Decimal
  currencyCode: String
  fee: Decimal
  notes: String
}

type AddTransactionPayload {
  transactionId: String!
  portfolio: Portfolio!
}

type Instrument {
  id: ID!
  symbol: String!
  name: String!
  currencyCode: String!
  assetClass: String!
}

type Query {
  portfolio: Portfolio!
  instruments: [Instrument!]!
}

type Mutation {
  addTransaction(input: AddTransactionInput!): AddTransactionPayload!
}

type Portfolio {
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  annualizedReturnPercent: Decimal!
  cashBalance: Money!
  investments: [Investment!]!
}

type Investment {
  id: ID!
  ticker: String!
  name: String!
  price: Money!
  quantity: Decimal!
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  totalReturnAmount: Money!
  totalReturnPercent: Decimal!
}