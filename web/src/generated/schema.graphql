"""Arbitrary-precision decimal serialized as a string, e.g. "1234.56"."""
scalar Decimal

type Money {
  amount: Decimal!
  currencyCode: String!
}

type Query {
  portfolio: Portfolio!
}

type Portfolio {
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  annualizedReturnPercent: Decimal!
  cashBalance: Money!
  investments: [Investment!]!
}

type Investment {
  id: ID!
  ticker: String!
  name: String!
  price: Money!
  quantity: Decimal!
  totalValue: Money!
  todayReturnAmount: Money!
  todayReturnPercent: Decimal!
  totalReturnAmount: Money!
  totalReturnPercent: Decimal!
}