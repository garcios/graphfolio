syntax = "proto3";

package user.v1;

option go_package = "graphfolio/proto/user/v1;userpb";

service UserService {
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse) {}
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse) {}
  rpc ListSupportedCurrencies(ListSupportedCurrenciesRequest) returns (ListSupportedCurrenciesResponse) {}

  // Authentication & Session RPCs
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {}
}

message UserPreferences {
  string user_id          = 1;
  string email            = 2;
  string display_name     = 3;
  string display_currency = 4; // 3-letter ISO code: "USD", "EUR", "GBP", "AUD", etc.
  string theme            = 5; // "DARK", "LIGHT", "SYSTEM"
  string created_at       = 6;
  string updated_at       = 7;
}

message CurrencyInfo {
  string code   = 1; // "USD"
  string name   = 2; // "US Dollar"
  string symbol = 3; // "$"
}

message GetUserPreferencesRequest {
  string user_id = 1;
}

message GetUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message UpdateUserPreferencesRequest {
  string user_id                   = 1;
  optional string display_name     = 2;
  optional string display_currency = 3;
  optional string theme            = 4;
}

message UpdateUserPreferencesResponse {
  UserPreferences preferences = 1;
}

message ListSupportedCurrenciesRequest {}

message ListSupportedCurrenciesResponse {
  repeated CurrencyInfo currencies = 1;
}

message RegisterRequest {
  string email            = 1;
  string password         = 2;
  string display_name     = 3;
  string display_currency = 4;
}

message RegisterResponse {
  UserPreferences user    = 1;
  string access_token     = 2;
  string refresh_token    = 3;
  int64 expires_in        = 4;
}

message LoginRequest {
  string email            = 1;
  string password         = 2;
  bool remember_me        = 3;
}

message LoginResponse {
  UserPreferences user    = 1;
  string access_token     = 2;
  string refresh_token    = 3;
  int64 expires_in        = 4;
}

message RefreshTokenRequest {
  string refresh_token    = 1;
}

message RefreshTokenResponse {
  string access_token     = 1;
  string refresh_token    = 2;
  int64 expires_in        = 3;
  UserPreferences user    = 4;
}

message LogoutRequest {
  string refresh_token    = 1;
}

message LogoutResponse {
  bool success            = 1;
}

message GetMeRequest {
  string user_id          = 1;
}

message GetMeResponse {
  UserPreferences user    = 1;
}
