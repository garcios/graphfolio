syntax = "proto3";

package portfolio.v1;

option go_package = "graphfolio/proto/portfolio/v1;portfoliopb";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {}
}

message GetPortfolioRequest {
  string user_id = 1;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

message Portfolio {
  double total_value = 1;
  double today_return_amount = 2;
  double today_return_percent = 3;
  double annualized_return_percent = 4;
  double cash_balance = 5;
  repeated Investment investments = 6;
}

message Investment {
  string id = 1;
  string ticker = 2;
  string name = 3;
  double price = 4;
  double quantity = 5;
  double total_value = 6;
  double today_return_amount = 7;
  double today_return_percent = 8;
  double total_return_amount = 9;
  double total_return_percent = 10;
}
