syntax = "proto3";

package portfolio.v1;

import "common/v1/decimal.proto";

option go_package = "graphfolio/proto/portfolio/v1;portfoliopb";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {}
  rpc AddTransaction(AddTransactionRequest) returns (AddTransactionResponse) {}
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse) {}
  rpc GetPortfolioHistory(GetPortfolioHistoryRequest) returns (GetPortfolioHistoryResponse) {}
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse) {}
}

message GetPortfolioRequest {
  string user_id = 1;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_BUY = 1;
  TRANSACTION_TYPE_SELL = 2;
  TRANSACTION_TYPE_DIVIDEND = 3;
  TRANSACTION_TYPE_DEPOSIT = 4;
  TRANSACTION_TYPE_WITHDRAWAL = 5;
  TRANSACTION_TYPE_INTEREST = 6;
  TRANSACTION_TYPE_FEE = 7;
  TRANSACTION_TYPE_TAX = 8;
  TRANSACTION_TYPE_TRANSFER_IN = 9;
  TRANSACTION_TYPE_TRANSFER_OUT = 10;
  TRANSACTION_TYPE_FX_CONVERSION = 11;
}

message AddTransactionRequest {
  string            user_id    = 1;
  TransactionType   type       = 2;
  string            symbol     = 3; // e.g. "AAPL" (optional for DEPOSIT/WITHDRAWAL)
  string            trade_date = 4; // YYYY-MM-DD
  common.v1.Decimal quantity   = 5; // e.g. "10"
  common.v1.Money   price      = 6; // unit price
  common.v1.Money   amount     = 7; // total cash flow / value
  common.v1.Money   fee        = 8; // optional fee
  string            notes      = 9;
}

message AddTransactionResponse {
  string    transaction_id = 1;
  Portfolio portfolio      = 2;
}

message Instrument {
  string id            = 1;
  string symbol        = 2;
  string name          = 3;
  string currency_code = 4;
  string asset_class   = 5;
}

message ListInstrumentsRequest {}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message Portfolio {
  common.v1.Money   total_value               = 1;
  common.v1.Money   today_return_amount       = 2;
  common.v1.Decimal today_return_percent      = 3;
  common.v1.Decimal annualized_return_percent = 4;
  common.v1.Money   cash_balance              = 5;
  repeated Investment investments             = 6;
}

message Investment {
  string            id                   = 1;
  string            ticker               = 2;
  string            name                 = 3;
  common.v1.Money   price                = 4;
  common.v1.Decimal quantity             = 5;
  common.v1.Money   total_value          = 6;
  common.v1.Money   today_return_amount  = 7;
  common.v1.Decimal today_return_percent = 8;
  common.v1.Money   total_return_amount  = 9;
  common.v1.Decimal total_return_percent = 10;
}

enum HistoryTimeframe {
  HISTORY_TIMEFRAME_UNSPECIFIED = 0;
  HISTORY_TIMEFRAME_1D = 1;
  HISTORY_TIMEFRAME_1W = 2;
  HISTORY_TIMEFRAME_1M = 3;
  HISTORY_TIMEFRAME_1Y = 4;
  HISTORY_TIMEFRAME_ALL = 5;
}

message ValuationPoint {
  string            date         = 1; // YYYY-MM-DD
  common.v1.Money   total_value  = 2; // Market value + cash value
  common.v1.Money   market_value = 3;
  common.v1.Money   cash_value   = 4;
  common.v1.Decimal twr_index    = 5;
  common.v1.Decimal daily_return = 6;
}

message GetPortfolioHistoryRequest {
  string           user_id   = 1;
  HistoryTimeframe timeframe = 2;
}

message GetPortfolioHistoryResponse {
  repeated ValuationPoint points         = 1;
  common.v1.Money         start_value    = 2;
  common.v1.Money         end_value      = 3;
  common.v1.Money         return_amount  = 4;
  common.v1.Decimal       return_percent = 5;
}

message TransactionItem {
  string            id              = 1;
  TransactionType   type            = 2;
  string            symbol          = 3; // empty for cash events
  string            instrument_name = 4;
  string            trade_date      = 5; // YYYY-MM-DD
  common.v1.Decimal quantity        = 6; // nullable
  common.v1.Money   price           = 7; // nullable
  common.v1.Money   amount          = 8;
  common.v1.Money   fee             = 9;
  string            notes           = 10;
  string            created_at      = 11;
}

message ListTransactionsRequest {
  string          user_id   = 1;
  TransactionType type      = 2; // optional filter (0 = all)
  string          symbol    = 3; // optional symbol filter
  int32           page      = 4; // 1-indexed, default 1
  int32           page_size = 5; // default 20, max 100
}

message ListTransactionsResponse {
  repeated TransactionItem transactions = 1;
  int32                    total_count  = 2;
  int32                    page         = 3;
  int32                    page_size    = 4;
}

message DeleteTransactionRequest {
  string user_id        = 1;
  string transaction_id = 2;
}

message DeleteTransactionResponse {
  bool      success   = 1;
  Portfolio portfolio = 2; // Recomputed portfolio metrics
}
