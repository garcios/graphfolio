syntax = "proto3";

package portfolio.v1;

import "common/v1/decimal.proto";

option go_package = "graphfolio/proto/portfolio/v1;portfoliopb";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {}
  rpc CreatePortfolio(CreatePortfolioRequest) returns (CreatePortfolioResponse) {}
  rpc UpdatePortfolioBaseCurrency(UpdatePortfolioBaseCurrencyRequest) returns (UpdatePortfolioBaseCurrencyResponse) {}
  rpc AddTransaction(AddTransactionRequest) returns (AddTransactionResponse) {}
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse) {}
  rpc GetPortfolioHistory(GetPortfolioHistoryRequest) returns (GetPortfolioHistoryResponse) {}
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse) {}
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse) {}

  // Multi-Broker CSV Ingestion & Deduplication
  rpc CheckTransactionDuplicates(CheckTransactionDuplicatesRequest) returns (CheckTransactionDuplicatesResponse) {}
  rpc BatchImportTransactions(BatchImportTransactionsRequest) returns (BatchImportTransactionsResponse) {}

  // Admin: Asset Directory Management
  rpc ListAllInstruments(ListAllInstrumentsRequest) returns (ListAllInstrumentsResponse) {}
  rpc CreateInstrument(CreateInstrumentRequest) returns (CreateInstrumentResponse) {}
  rpc UpdateInstrument(UpdateInstrumentRequest) returns (UpdateInstrumentResponse) {}
  rpc DeleteInstrument(DeleteInstrumentRequest) returns (DeleteInstrumentResponse) {}
  rpc ListExchanges(ListExchangesRequest) returns (ListExchangesResponse) {}

  // Admin: Closing Price Management & Overrides
  rpc ListInstrumentPrices(ListInstrumentPricesRequest) returns (ListInstrumentPricesResponse) {}
  rpc RecordPriceOverride(RecordPriceOverrideRequest) returns (RecordPriceOverrideResponse) {}

  // Admin: Ingestion Pipeline & Diagnostics
  rpc GetIngestionStatus(GetIngestionStatusRequest) returns (GetIngestionStatusResponse) {}
  rpc TriggerMarketSync(TriggerMarketSyncRequest) returns (TriggerMarketSyncResponse) {}
  rpc TriggerDividendSync(TriggerDividendSyncRequest) returns (TriggerDividendSyncResponse) {}

  // Admin: FX Rates & Currency Pair Inspection
  rpc ListCurrencyPairs(ListCurrencyPairsRequest) returns (ListCurrencyPairsResponse) {}
  rpc ListFXRates(ListFXRatesRequest) returns (ListFXRatesResponse) {}
  rpc GetCurrencyPairHistory(GetCurrencyPairHistoryRequest) returns (GetCurrencyPairHistoryResponse) {}
  rpc RecordFXRateOverride(RecordFXRateOverrideRequest) returns (RecordFXRateOverrideResponse) {}

  // Admin: Historical Market Data Backfill
  rpc TriggerBackfill(TriggerBackfillRequest) returns (TriggerBackfillResponse) {}

  // Admin: Missing Prices Diagnostic Report
  rpc ListMissingPriceTransactions(ListMissingPriceTransactionsRequest) returns (ListMissingPriceTransactionsResponse) {}

  // Admin: Missing FX Rates Diagnostic Report
  rpc ListMissingFXRateTransactions(ListMissingFXRateTransactionsRequest) returns (ListMissingFXRateTransactionsResponse) {}

  // Historical Valuation Engine & Replay
  rpc RebuildValuations(RebuildValuationsRequest) returns (RebuildValuationsResponse) {}

  // Portfolio Cash Flow Report
  rpc GetCashFlowReport(GetCashFlowReportRequest) returns (GetCashFlowReportResponse) {}

  // Return Analytics: Modified Dietz Method
  rpc GetModifiedDietzReturn(GetModifiedDietzReturnRequest) returns (GetModifiedDietzReturnResponse) {}

  // Benchmark Comparison & Relative Performance Analytics
  rpc ListBenchmarks(ListBenchmarksRequest) returns (ListBenchmarksResponse) {}
  rpc GetBenchmarkComparison(GetBenchmarkComparisonRequest) returns (GetBenchmarkComparisonResponse) {}

  // Dividend Calendar, Yield Analytics & DRIP Simulator
  rpc GetDividendCalendar(GetDividendCalendarRequest) returns (GetDividendCalendarResponse) {}
  rpc GetDividendYieldAnalytics(GetDividendYieldAnalyticsRequest) returns (GetDividendYieldAnalyticsResponse) {}
  rpc SimulateDRIP(SimulateDRIPRequest) returns (SimulateDRIPResponse) {}

  // Tax Lot Inspector, Capital Gains & Annual Tax Report
  rpc ListTaxLots(ListTaxLotsRequest) returns (ListTaxLotsResponse) {}
  rpc GetRealizedGainsReport(GetRealizedGainsReportRequest) returns (GetRealizedGainsReportResponse) {}
  rpc GetTaxReport(GetTaxReportRequest) returns (GetTaxReportResponse) {}
}

message RebuildValuationsRequest {
  string user_id   = 1;
  string from_date = 2; // Optional: YYYY-MM-DD
}

message RebuildValuationsResponse {
  bool   success = 1;
  string message = 2;
}

message GetPortfolioRequest {
  string user_id                  = 1;
  bool   include_closed_positions = 2;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

message UpdatePortfolioBaseCurrencyRequest {
  string user_id       = 1;
  string base_currency = 2; // e.g. "AUD"
}

message UpdatePortfolioBaseCurrencyResponse {
  Portfolio portfolio = 1;
}

message CreatePortfolioRequest {
  string user_id           = 1;
  string name              = 2;
  string base_currency     = 3; // e.g. "AUD"
  string cost_basis_method = 4; // e.g. "AVERAGE_COST"
}

message CreatePortfolioResponse {
  string portfolio_id      = 1;
  string name              = 2;
  string base_currency     = 3;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_BUY = 1;
  TRANSACTION_TYPE_SELL = 2;
  TRANSACTION_TYPE_DIVIDEND = 3;
  TRANSACTION_TYPE_DEPOSIT = 4;
  TRANSACTION_TYPE_WITHDRAWAL = 5;
  TRANSACTION_TYPE_INTEREST = 6;
  TRANSACTION_TYPE_FEE = 7;
  TRANSACTION_TYPE_TAX = 8;
  TRANSACTION_TYPE_TRANSFER_IN = 9;
  TRANSACTION_TYPE_TRANSFER_OUT = 10;
  TRANSACTION_TYPE_FX_CONVERSION = 11;
  TRANSACTION_TYPE_SPLIT = 12;
}

message AddTransactionRequest {
  string            user_id    = 1;
  TransactionType   type       = 2;
  string            symbol     = 3; // e.g. "AAPL" (optional for DEPOSIT/WITHDRAWAL)
  string            trade_date = 4; // YYYY-MM-DD
  common.v1.Decimal quantity   = 5; // e.g. "10"
  common.v1.Money   price      = 6; // unit price
  common.v1.Money   amount     = 7; // total cash flow / value
  common.v1.Money   fee        = 8; // optional fee
  string            notes      = 9;
}

message AddTransactionResponse {
  string    transaction_id = 1;
  Portfolio portfolio      = 2;
}

message Instrument {
  string id            = 1;
  string symbol        = 2;
  string name          = 3;
  string currency_code = 4;
  string asset_class   = 5;
  string exchange_code = 6;
  string isin          = 7;
  bool   is_active     = 8;
}

message ListInstrumentsRequest {}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message Portfolio {
  common.v1.Money   total_value               = 1;
  common.v1.Money   today_return_amount       = 2;
  common.v1.Decimal today_return_percent      = 3;
  common.v1.Decimal annualized_return_percent = 4;
  common.v1.Money   cash_balance              = 5;
  repeated Investment investments             = 6;
  string            inception_date            = 7;
}

message Investment {
  string            id                     = 1;
  string            ticker                 = 2;
  string            name                   = 3;
  common.v1.Money   price                  = 4;
  common.v1.Decimal quantity               = 5;
  common.v1.Money   total_value            = 6;
  common.v1.Money   today_return_amount    = 7;
  common.v1.Decimal today_return_percent   = 8;
  common.v1.Money   total_return_amount    = 9;
  common.v1.Decimal total_return_percent   = 10;
  common.v1.Money   capital_gain_amount    = 11;
  common.v1.Decimal capital_gain_percent   = 12;
  common.v1.Money   income_amount          = 13;
  common.v1.Decimal income_yield_percent   = 14;
  common.v1.Money   currency_gain_amount   = 15;
  common.v1.Decimal currency_gain_percent  = 16;
  bool              is_international       = 17;
  common.v1.Money   average_buy_price      = 18;
  bool              is_closed              = 19;
}

enum HistoryTimeframe {
  HISTORY_TIMEFRAME_UNSPECIFIED = 0;
  HISTORY_TIMEFRAME_1D = 1;
  HISTORY_TIMEFRAME_1W = 2;
  HISTORY_TIMEFRAME_1M = 3;
  HISTORY_TIMEFRAME_1Y = 4;
  HISTORY_TIMEFRAME_ALL = 5;
}

message ValuationPoint {
  string            date         = 1; // YYYY-MM-DD
  common.v1.Money   total_value  = 2; // Market value + cash value
  common.v1.Money   market_value = 3;
  common.v1.Money   cash_value   = 4;
  common.v1.Decimal twr_index    = 5;
  common.v1.Decimal daily_return = 6;
}

message GetPortfolioHistoryRequest {
  string           user_id   = 1;
  HistoryTimeframe timeframe = 2;
}

message GetPortfolioHistoryResponse {
  repeated ValuationPoint points         = 1;
  common.v1.Money         start_value    = 2;
  common.v1.Money         end_value      = 3;
  common.v1.Money         return_amount  = 4;
  common.v1.Decimal       return_percent = 5;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_DESC        = 1; // Default: newest first for UI display
  SORT_DIRECTION_ASC         = 2; // Chronological: oldest first for export/audit
}

message TransactionItem {
  string            id                  = 1;
  TransactionType   type                = 2;
  string            symbol              = 3; // empty for cash events
  string            instrument_name     = 4;
  string            trade_date          = 5; // YYYY-MM-DD
  common.v1.Decimal quantity            = 6; // nullable
  common.v1.Money   price               = 7; // nullable
  common.v1.Money   amount              = 8;
  common.v1.Money   fee                 = 9;
  string            notes               = 10;
  string            created_at          = 11;
  common.v1.Money   withholding_tax     = 12;
  common.v1.Decimal fx_rate_to_base     = 13;
  string            external_ref        = 14;
}

message ListTransactionsRequest {
  string          user_id        = 1;
  TransactionType type           = 2; // optional filter (0 = all)
  string          symbol         = 3; // optional symbol filter
  int32           page           = 4; // 1-indexed, default 1
  int32           page_size      = 5; // default 20, max 100 (0 = unpaginated / return all)
  SortDirection   sort_direction = 6;
}

message ListTransactionsResponse {
  repeated TransactionItem transactions = 1;
  int32                    total_count  = 2;
  int32                    page         = 3;
  int32                    page_size    = 4;
}

message DeleteTransactionRequest {
  string user_id        = 1;
  string transaction_id = 2;
}

message DeleteTransactionResponse {
  bool      success   = 1;
  Portfolio portfolio = 2; // Recomputed portfolio metrics
}

message UpdateTransactionRequest {
  string                    user_id           = 1;
  string                    transaction_id    = 2;
  TransactionType           type              = 3;
  string                    trade_date        = 4; // YYYY-MM-DD
  optional string           symbol            = 5; // e.g. "AAPL" (optional for DEPOSIT/WITHDRAWAL)
  optional common.v1.Decimal quantity         = 6; // Required for BUY/SELL/SPLIT
  optional common.v1.Money  price             = 7; // Unit price
  common.v1.Money           amount            = 8; // Total cash flow / value
  optional common.v1.Money  fee               = 9; // Brokerage fee
  optional string           notes             = 10;
  optional common.v1.Decimal fx_rate_to_base  = 11; // Optional manual override
  optional string           currency_code     = 12; // Cash or execution currency code
  optional string           fee_currency_code = 13;
}

message UpdateTransactionResponse {
  bool            success     = 1;
  TransactionItem transaction = 2;
  Portfolio       portfolio   = 3; // Recomputed portfolio snapshot
}

// ------------------------------------------------------------------
// Admin: Asset Directory Messages
// ------------------------------------------------------------------

message ListAllInstrumentsRequest {
  optional bool   is_active = 1;
  optional string search    = 2;
}

message ListAllInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message CreateInstrumentRequest {
  string          symbol        = 1; // e.g. "NVDA"
  string          exchange_code = 2; // e.g. "XNAS"
  string          name          = 3; // e.g. "NVIDIA Corporation"
  string          asset_class   = 4; // e.g. "EQUITY", "ETF", "CRYPTO"
  string          currency_code = 5; // e.g. "USD"
  optional string isin          = 6; // e.g. "US67066G1040"
}

message CreateInstrumentResponse {
  Instrument instrument = 1;
}

message UpdateInstrumentRequest {
  string          id        = 1; // Instrument UUID
  optional string name      = 2;
  optional bool   is_active = 3;
  optional string isin      = 4;
}

message UpdateInstrumentResponse {
  Instrument instrument = 1;
}

message DeleteInstrumentRequest {
  string id = 1; // Instrument UUID
}

message DeleteInstrumentResponse {
  bool   success = 1;
  string id      = 2; // Instrument UUID that was deleted
}

message Exchange {
  string code     = 1; // ISO 10383 MIC, e.g. "XNAS"
  string name     = 2; // e.g. "NASDAQ Stock Market"
  string country  = 3; // ISO 3166-1 alpha-2, e.g. "US"
  string timezone = 4; // IANA timezone, e.g. "America/New_York"
}

message ListExchangesRequest {}

message ListExchangesResponse {
  repeated Exchange exchanges = 1;
}

// ------------------------------------------------------------------
// Admin: Price Management Messages
// ------------------------------------------------------------------

message InstrumentPriceItem {
  string          instrument_id = 1;
  string          symbol        = 2;
  string          price_date    = 3; // YYYY-MM-DD
  common.v1.Money price         = 4; // Unit close price + currency
  string          source        = 5; // e.g. "TWELVE_DATA", "MANUAL_OVERRIDE"
  string          updated_at    = 6; // ISO 8601 timestamp
}

message ListInstrumentPricesRequest {
  optional string symbol    = 1;
  optional string from_date = 2; // YYYY-MM-DD
  optional string to_date   = 3; // YYYY-MM-DD
  int32           limit     = 4; // Default 50, max 200
  int32           offset    = 5;
}

message ListInstrumentPricesResponse {
  repeated InstrumentPriceItem prices      = 1;
  int32                        total_count = 2;
}

message RecordPriceOverrideRequest {
  string            symbol               = 1;
  string            price_date           = 2; // YYYY-MM-DD
  common.v1.Decimal price                = 3; // Exact override price
  optional string   reason               = 4; // Audit note
  bool              recompute_valuations = 5; // Trigger retroactive portfolio valuation update
}

message RecordPriceOverrideResponse {
  InstrumentPriceItem price                 = 1;
  bool                valuations_recomputed = 2;
}

// ------------------------------------------------------------------
// Admin: Ingestion Pipeline & Diagnostics Messages
// ------------------------------------------------------------------

message FeedHealthStatus {
  string name     = 1;
  string status   = 2;
  string provider = 3;
  string schedule = 4;
  string last_run = 5;
  string details  = 6;
}

message GetIngestionStatusRequest {}

message GetIngestionStatusResponse {
  repeated FeedHealthStatus feeds                 = 1;
  int32                     tracked_instruments   = 2;
  int32                     tracked_currencies    = 3;
  string                    latest_price_date     = 4;
  string                    latest_fx_date        = 5;
  int32                     rate_limit_remaining  = 6;
  int32                     rate_limit_budget     = 7;
  int32                     pending_backfill_jobs = 8;
}

message TriggerMarketSyncRequest {
  repeated string symbols = 1;
  bool            sync_fx = 2;
}

message TriggerMarketSyncResponse {
  bool   success         = 1;
  int32  prices_synced   = 2;
  int32  fx_rates_synced = 3;
  string message         = 4;
}

message TriggerDividendSyncRequest {
  repeated string symbols         = 1;
  optional string exchange_code   = 2;
  bool            sync_historical = 3;
  string          force_provider  = 4; // 'YAHOO', 'TWELVE_DATA', or empty for default cascade
}

message TriggerDividendSyncResponse {
  bool            success               = 1;
  int32           schedules_synced      = 2;
  int32           primary_source_count  = 3; // Synced via Yahoo Finance
  int32           fallback_source_count = 4; // Synced via Twelve Data fallback
  int32           placeholders_upgraded = 5; // Estimated schedules upgraded to official board declarations
  string          message               = 6;
  int64           duration_ms           = 7;
  repeated string failed_symbols        = 8;
}


// ------------------------------------------------------------------
// Admin: Foreign Exchange (FX) & Currency Pair Messages
// ------------------------------------------------------------------

message CurrencyPairItem {
  string            base_currency    = 1;
  string            quote_currency   = 2;
  common.v1.Decimal latest_rate      = 3;
  string            latest_date      = 4; // YYYY-MM-DD
  string            latest_source    = 5;
  common.v1.Decimal previous_rate    = 6; // nullable
  common.v1.Decimal change_1d_amount = 7; // nullable
  common.v1.Decimal change_1d_pct    = 8; // nullable
  int32             total_records    = 9;
  string            first_date       = 10;
  string            last_date        = 11;
}

message ListCurrencyPairsRequest {}

message ListCurrencyPairsResponse {
  repeated CurrencyPairItem pairs = 1;
}

message FXRateItem {
  string            base_currency  = 1;
  string            quote_currency = 2;
  string            rate_date      = 3; // YYYY-MM-DD
  common.v1.Decimal rate           = 4;
  common.v1.Decimal inverted_rate  = 5; // 1 / rate (exact 10 decimals)
  string            source         = 6;
}

message ListFXRatesRequest {
  optional string base_currency  = 1;
  optional string quote_currency = 2;
  optional string from_date      = 3; // YYYY-MM-DD
  optional string to_date        = 4; // YYYY-MM-DD
  int32           limit          = 5; // Default 50, max 200
  int32           offset         = 6;
}

message ListFXRatesResponse {
  repeated FXRateItem rates       = 1;
  int32               total_count = 2;
}

message FXHistoryPoint {
  string            date          = 1; // YYYY-MM-DD
  common.v1.Decimal rate          = 2;
  common.v1.Decimal inverted_rate = 3;
  string            source        = 4;
}

message GetCurrencyPairHistoryRequest {
  string           base_currency  = 1;
  string           quote_currency = 2;
  HistoryTimeframe timeframe      = 3; // 1D, 1W, 1M, 1Y, ALL
}

message GetCurrencyPairHistoryResponse {
  string                  base_currency     = 1;
  string                  quote_currency    = 2;
  repeated FXHistoryPoint points            = 3;
  common.v1.Decimal       start_rate        = 4;
  common.v1.Decimal       end_rate          = 5;
  common.v1.Decimal       period_change     = 6;
  common.v1.Decimal       period_change_pct = 7;
  common.v1.Decimal       period_high       = 8;
  common.v1.Decimal       period_low        = 9;
}

message RecordFXRateOverrideRequest {
  string            base_currency        = 1;
  string            quote_currency       = 2;
  string            rate_date            = 3; // YYYY-MM-DD
  common.v1.Decimal rate                 = 4; // Greater than zero
  optional string   reason               = 5; // Audit note
  bool              recompute_valuations = 6;
}

message RecordFXRateOverrideResponse {
  FXRateItem rate                  = 1;
  bool       valuations_recomputed = 2;
}

message TriggerBackfillRequest {
  string          from_date            = 1; // YYYY-MM-DD (inclusive start date)
  string          to_date              = 2; // YYYY-MM-DD (inclusive end date, defaults to today)
  repeated string symbols              = 3; // Optional list of ticker symbols. If empty & backfill_assets=true, all active instruments are backfilled.
  repeated string currency_pairs       = 4; // Optional list of currency pairs (e.g. "EUR/USD"). If empty & backfill_fx=true, standard pairs are backfilled.
  bool            backfill_assets      = 5; // Whether to backfill equity/ETF/fund closing prices
  bool            backfill_fx          = 6; // Whether to backfill foreign exchange reference rates
  bool            recompute_valuations = 7; // Whether to recompute affected portfolio historical valuations
}

message TriggerBackfillResponse {
  bool            success         = 1;
  int32           prices_synced   = 2;
  int32           fx_rates_synced = 3;
  string          message         = 4;
  repeated string warnings        = 5;
}

// ------------------------------------------------------------------
// Multi-Broker CSV Batch Ingestion Messages
// ------------------------------------------------------------------

message CheckTransactionDuplicatesRequest {
  string          user_id       = 1;
  repeated string external_refs = 2;
}

message CheckTransactionDuplicatesResponse {
  repeated string existing_external_refs = 1;
}

message ImportTransactionItem {
  TransactionType   type          = 1;
  string            symbol        = 2; // e.g. "BHP"
  string            trade_date    = 3; // YYYY-MM-DD
  string            settle_date   = 4; // Optional: YYYY-MM-DD
  common.v1.Decimal quantity      = 5;
  common.v1.Money   price         = 6;
  common.v1.Money   amount        = 7;
  common.v1.Money   fee           = 8;
  string            external_ref  = 9; // e.g. "nabtrade:C10982347" or "cs_sha256..."
  string            notes         = 10;
}

message BatchImportTransactionsRequest {
  string                         user_id          = 1;
  repeated ImportTransactionItem transactions     = 2;
  bool                           skip_duplicates  = 3; // Default true: ignores existing external_refs
}

message BatchImportTransactionsResponse {
  bool      success         = 1;
  int32     imported_count  = 2;
  int32     skipped_count   = 3;
  Portfolio portfolio       = 4; // Updated portfolio snapshot
  string    message         = 5;
}

enum CashFlowTimeframe {
  CASH_FLOW_TIMEFRAME_UNSPECIFIED = 0;
  CASH_FLOW_TIMEFRAME_MTD = 1;
  CASH_FLOW_TIMEFRAME_YTD = 2;
  CASH_FLOW_TIMEFRAME_1M  = 3;
  CASH_FLOW_TIMEFRAME_3M  = 4;
  CASH_FLOW_TIMEFRAME_6M  = 5;
  CASH_FLOW_TIMEFRAME_1Y  = 6;
  CASH_FLOW_TIMEFRAME_ALL = 7;
  CASH_FLOW_TIMEFRAME_CUSTOM = 8;
}

message GetCashFlowReportRequest {
  string            user_id   = 1;
  CashFlowTimeframe timeframe = 2;
  string            from_date = 3; // YYYY-MM-DD (used if CUSTOM)
  string            to_date   = 4; // YYYY-MM-DD (optional, defaults to current date)
  string            currency  = 5; // Optional currency filter / target
}

message CashFlowSummary {
  common.v1.Money starting_cash_balance   = 1;
  common.v1.Money total_inflows           = 2;
  common.v1.Money total_outflows          = 3;
  common.v1.Money net_cash_flow           = 4;
  common.v1.Money ending_cash_balance     = 5;
  common.v1.Money unrealized_fx_gain_loss = 6;
}

message CashFlowCategoryBreakdown {
  common.v1.Money deposits       = 1;
  common.v1.Money dividends      = 2;
  common.v1.Money interest       = 3;
  common.v1.Money sales_proceeds = 4;
  common.v1.Money withdrawals    = 5;
  common.v1.Money purchases      = 6;
  common.v1.Money fees           = 7;
  common.v1.Money taxes          = 8;
}

message CashFlowItem {
  string            id              = 1;
  string            event_date      = 2; // YYYY-MM-DD
  TransactionType   type            = 3;
  string            flow_direction  = 4; // "INFLOW" or "OUTFLOW"
  string            category        = 5; // e.g. "DIVIDENDS", "PURCHASES", "CAPITAL_DEPOSITS"
  string            symbol          = 6; // e.g. "AAPL", "IVV.AX", or empty
  string            instrument_name = 7;
  string            description     = 8;
  common.v1.Money   net_amount      = 9; // Net cash flow impact in base currency
  common.v1.Money   running_balance = 10;// Cumulative cash balance in base currency
  common.v1.Money   local_amount    = 11;// Original transaction currency & amount
  common.v1.Money   fee             = 12;
  common.v1.Money   withholding_tax = 13;
}

message GetCashFlowReportResponse {
  CashFlowSummary           summary        = 1;
  CashFlowCategoryBreakdown breakdown      = 2;
  repeated CashFlowItem     items          = 3;
  string                    base_currency  = 4;
  string                    from_date      = 5;
  string                    to_date        = 6;
}

// ------------------------------------------------------------------
// Admin: Missing Prices Diagnostic Report Messages
// ------------------------------------------------------------------

message MissingPriceTransactionItem {
  string            transaction_id  = 1;
  string            portfolio_id    = 2;
  string            instrument_id   = 3;
  string            symbol          = 4;
  string            asset_name      = 5;
  string            exchange_mic    = 6;
  string            trade_date      = 7; // YYYY-MM-DD
  TransactionType   type            = 8;
  common.v1.Decimal quantity        = 9;
  common.v1.Money   execution_price = 10;
  string            currency_code   = 11;
}

message ListMissingPriceTransactionsRequest {
  optional string symbol    = 1;
  optional string from_date = 2; // YYYY-MM-DD
  optional string to_date   = 3; // YYYY-MM-DD
  int32           limit     = 4; // Default 50, max 200
  int32           offset    = 5;
}

message ListMissingPriceTransactionsResponse {
  repeated MissingPriceTransactionItem items                    = 1;
  int32                                total_count              = 2;
  int32                                unique_instruments_count  = 3;
  optional string                      earliest_trade_date      = 4; // YYYY-MM-DD
  optional string                      latest_trade_date        = 5; // YYYY-MM-DD
}

// ------------------------------------------------------------------
// Admin: Missing FX Rates Diagnostic Report Messages
// ------------------------------------------------------------------

message MissingFXRateTransactionItem {
  string                     transaction_id       = 1;
  string                     portfolio_id         = 2;
  string                     portfolio_name       = 3;
  string                     portfolio_base_cur   = 4;
  string                     trade_date           = 5; // YYYY-MM-DD
  TransactionType            type                 = 6;
  optional string            instrument_id        = 7;
  optional string            symbol               = 8;
  optional string            asset_name           = 9;
  common.v1.Money            amount               = 10;
  string                     transaction_cur      = 11;
  string                     required_pair        = 12; // e.g. "USD/AUD"
  optional common.v1.Decimal recorded_fx_rate     = 13; // Snapshot fx_rate_to_base if present
}

message ListMissingFXRateTransactionsRequest {
  optional string          currency_pair = 1; // e.g. "USD/AUD"
  optional string          from_date     = 2; // YYYY-MM-DD
  optional string          to_date       = 3; // YYYY-MM-DD
  optional TransactionType type          = 4;
  int32                    limit         = 5; // Default 50, max 200
  int32                    offset        = 6;
}

message ListMissingFXRateTransactionsResponse {
  repeated MissingFXRateTransactionItem items               = 1;
  int32                                 total_count         = 2;
  int32                                 unique_pairs_count  = 3;
  optional string                       earliest_trade_date = 4; // YYYY-MM-DD
  optional string                       latest_trade_date   = 5; // YYYY-MM-DD
}


// ------------------------------------------------------------------
// Return Analytics: Modified Dietz Method Messages
// ------------------------------------------------------------------

message GetModifiedDietzReturnRequest {
  string user_id             = 1;
  string start_date          = 2; // YYYY-MM-DD
  string end_date            = 3; // YYYY-MM-DD
  bool   use_monthly_linking = 4; // Optional: geometric chaining over monthly intervals
}

message ExternalCashFlowWeight {
  string            transaction_id  = 1;
  string            date            = 2; // YYYY-MM-DD
  TransactionType   type            = 3; // DEPOSIT or WITHDRAWAL
  common.v1.Money   amount          = 4; // Converted to base currency
  common.v1.Decimal weight          = 5; // W_i = (CD - D_i) / CD
  common.v1.Money   weighted_amount = 6; // W_i * F_i
  common.v1.Money   local_amount    = 7; // Original transaction currency and amount
}

message GetModifiedDietzReturnResponse {
  string                          portfolio_id              = 1;
  string                          base_currency             = 2;
  string                          start_date                = 3;
  string                          end_date                  = 4;
  int32                           elapsed_days              = 5;
  common.v1.Money                 start_valuation           = 6;
  common.v1.Money                 end_valuation             = 7;
  common.v1.Money                 net_external_flows        = 8;
  common.v1.Money                 net_investment_gain       = 9;
  common.v1.Money                 weighted_capital_employed = 10;
  common.v1.Decimal               cumulative_return_percent = 11;
  common.v1.Decimal               annualized_return_percent = 12;
  bool                            is_annualized             = 13;
  bool                            is_computable             = 14;
  string                          diagnostic_code           = 15; // OK, ZERO_CAPITAL_EMPLOYED, NEGATIVE_AVERAGE_CAPITAL
  repeated ExternalCashFlowWeight cash_flow_weights         = 16;
}

// ------------------------------------------------------------------
// Benchmark Comparison & Relative Performance Messages
// ------------------------------------------------------------------

enum BenchmarkCurrencyMode {
  BENCHMARK_CURRENCY_MODE_UNSPECIFIED = 0;
  BENCHMARK_CURRENCY_MODE_PORTFOLIO_BASE = 1; // Translated to portfolio base currency via daily FX
  BENCHMARK_CURRENCY_MODE_BENCHMARK_NATIVE = 2; // Expressed in native benchmark currency (unhedged)
}

message Benchmark {
  string id            = 1; // e.g. "SP500TR"
  string symbol        = 2; // e.g. "SP500TR" or "SPY"
  string name          = 3; // e.g. "S&P 500 Total Return"
  string exchange_code = 4; // "XNYS"
  string currency_code = 5; // "USD"
  string index_type    = 6; // "TOTAL_RETURN"
  bool   is_default    = 7;
}

message ListBenchmarksRequest {}

message ListBenchmarksResponse {
  repeated Benchmark benchmarks = 1;
}

message BenchmarkComparisonPoint {
  string            date                     = 1; // YYYY-MM-DD
  common.v1.Decimal portfolio_return_percent = 2; // Cumulative return % from T_start
  common.v1.Decimal benchmark_return_percent = 3; // Cumulative return % from T_start
  common.v1.Decimal active_return_percent    = 4; // portfolio_return - benchmark_return
  common.v1.Money   portfolio_value          = 5; // Absolute portfolio valuation in base currency
  common.v1.Money   benchmark_price_adjusted = 6; // Benchmark price in selected currency mode
}

message BenchmarkMetrics {
  common.v1.Decimal portfolio_cumulative_return_percent = 1;
  common.v1.Decimal benchmark_cumulative_return_percent = 2;
  common.v1.Decimal active_cumulative_return_percent    = 3; // Outperformance (+) or Underperformance (-)
  common.v1.Decimal portfolio_annualized_return_percent = 4; // Null if elapsed < 365 days
  common.v1.Decimal benchmark_annualized_return_percent = 5; // Null if elapsed < 365 days
  common.v1.Decimal active_annualized_return_percent    = 6; // Null if elapsed < 365 days
  bool              is_annualized                       = 7; // GIPS Standard 2.A.20
  common.v1.Decimal beta                                = 8; // Null if observations < 30
  common.v1.Decimal tracking_error_percent              = 9; // Null if observations < 30
  common.v1.Decimal information_ratio                   = 10; // Null if elapsed < 365 or TE == 0
}

message GetBenchmarkComparisonRequest {
  string                user_id       = 1;
  string                benchmark_id  = 2; // e.g. "SP500TR"
  HistoryTimeframe      timeframe     = 3; // 1D, 1W, 1M, 1Y, ALL
  BenchmarkCurrencyMode currency_mode = 4; // BASE or NATIVE
}

message GetBenchmarkComparisonResponse {
  string                            portfolio_id  = 1;
  string                            base_currency = 2;
  Benchmark                         benchmark     = 3;
  BenchmarkCurrencyMode             currency_mode = 4;
  string                            start_date    = 5;
  string                            end_date      = 6;
  int32                             elapsed_days  = 7;
  repeated BenchmarkComparisonPoint points        = 8;
  BenchmarkMetrics                  metrics       = 9;
}

enum DividendFrequency {
  DIVIDEND_FREQUENCY_UNSPECIFIED = 0;
  DIVIDEND_FREQUENCY_MONTHLY     = 1;
  DIVIDEND_FREQUENCY_QUARTERLY   = 2;
  DIVIDEND_FREQUENCY_SEMI_ANNUAL = 3;
  DIVIDEND_FREQUENCY_ANNUAL      = 4;
  DIVIDEND_FREQUENCY_IRREGULAR   = 5;
}

enum DividendEventStatus {
  DIVIDEND_EVENT_STATUS_UNSPECIFIED    = 0;
  DIVIDEND_EVENT_STATUS_ANNOUNCED      = 1;
  DIVIDEND_EVENT_STATUS_EX_DATE_PASSED = 2;
  DIVIDEND_EVENT_STATUS_PAID           = 3;
  DIVIDEND_EVENT_STATUS_CANCELLED      = 4;
}

message GetDividendCalendarRequest {
  string user_id = 1;
  int32  year    = 2;
  int32  month   = 3; // 1..12
}

message GetDividendCalendarResponse {
  repeated DividendCalendarEvent events = 1;
}

message DividendCalendarEvent {
  string              id                = 1;
  string              instrument_id     = 2;
  string              symbol            = 3;
  string              name              = 4;
  string              ex_date           = 5; // YYYY-MM-DD
  string              record_date       = 6; // YYYY-MM-DD
  string              payment_date      = 7; // YYYY-MM-DD
  common.v1.Decimal   shares_held       = 8;
  common.v1.Money     dps_declared      = 9;  // Instrument currency
  common.v1.Money     gross_amount_base = 10; // Base currency
  common.v1.Money     net_amount_base   = 11; // After WHT
  DividendFrequency   frequency         = 12;
  DividendEventStatus status            = 13;
  bool                is_user_entitled  = 14;
  bool                is_estimated      = 15;
  common.v1.Decimal   franking_pct      = 16;
}

message GetDividendYieldAnalyticsRequest {
  string user_id = 1;
}

message MonthlyDividendProjection {
  int32           year             = 1;
  int32           month            = 2;
  common.v1.Money projected_income = 3;
  int32           dividend_count   = 4;
}

message HoldingYieldItem {
  string            instrument_id         = 1;
  string            symbol                = 2;
  string            name                  = 3;
  common.v1.Decimal quantity              = 4;
  common.v1.Money   current_price         = 5;
  common.v1.Money   average_buy_price     = 6;
  common.v1.Money   current_market_value  = 7;
  common.v1.Money   cost_basis            = 8;
  common.v1.Money   annual_dps            = 9;
  common.v1.Money   projected_annual_cash = 10;
  common.v1.Decimal current_yield_pct     = 11;
  common.v1.Decimal yield_on_cost_pct     = 12; // Nullable
  common.v1.Decimal dividend_cagr_3y      = 13; // Nullable
  DividendFrequency frequency             = 14;
  string            next_ex_date          = 15;
  string            next_payment_date     = 16;
}

message GetDividendYieldAnalyticsResponse {
  common.v1.Money                    annual_forward_income   = 1;
  common.v1.Money                    monthly_average_income  = 2;
  common.v1.Decimal                  portfolio_current_yield = 3;
  common.v1.Decimal                  portfolio_yield_on_cost = 4;
  common.v1.Money                    pending_cash_inflow     = 5;
  repeated MonthlyDividendProjection monthly_projections     = 6;
  repeated HoldingYieldItem          holdings_yield          = 7;
}

message SimulateDRIPRequest {
  string            user_id                  = 1;
  int32             horizon_years            = 2;
  common.v1.Decimal dividend_growth_rate_pct = 3;
  common.v1.Decimal capital_appreciation_pct = 4;
}

message DRIPSimulationPoint {
  int32             year                    = 1;
  common.v1.Decimal drip_portfolio_value    = 2;
  common.v1.Decimal cash_portfolio_value    = 3;
  common.v1.Decimal drip_accumulated_shares = 4;
  common.v1.Decimal cash_accumulated_cash   = 5;
  common.v1.Decimal drip_annual_dividend    = 6;
  common.v1.Decimal cash_annual_dividend    = 7;
}

message SimulateDRIPResponse {
  common.v1.Decimal            starting_portfolio_value = 1;
  common.v1.Decimal            starting_annual_dividend = 2;
  string                       base_currency            = 3;
  int32                        horizon_years            = 4;
  repeated DRIPSimulationPoint points                   = 5;
  common.v1.Decimal            terminal_drip_value      = 6;
  common.v1.Decimal            terminal_cash_value      = 7;
  common.v1.Decimal            drip_benefit_amount      = 8;
}

// ------------------------------------------------------------------
// Tax Lot Inspector & Capital Gains Messages
// ------------------------------------------------------------------

enum TaxLotStatus {
  TAX_LOT_STATUS_UNSPECIFIED = 0;
  TAX_LOT_STATUS_OPEN        = 1;
  TAX_LOT_STATUS_CLOSED      = 2;
  TAX_LOT_STATUS_ALL         = 3;
}

enum HoldingTermClassification {
  HOLDING_TERM_UNSPECIFIED = 0;
  HOLDING_TERM_SHORT_TERM  = 1; // Held < 365 days
  HOLDING_TERM_LONG_TERM   = 2; // Held >= 365 days (CGT discount eligible)
}

message TaxLotItem {
  string                    id                          = 1;
  string                    portfolio_id                = 2;
  string                    instrument_id               = 3;
  string                    ticker                      = 4;
  string                    name                        = 5;
  string                    open_transaction_id         = 6;
  string                    acquired_date               = 7;  // YYYY-MM-DD
  string                    closed_date                 = 8;  // YYYY-MM-DD (null if open)
  common.v1.Decimal         original_quantity           = 9;
  common.v1.Decimal         remaining_quantity          = 10;
  common.v1.Money           cost_basis                  = 11; // In instrument currency
  common.v1.Money           cost_basis_base             = 12; // In portfolio base currency
  common.v1.Money           unit_cost_base              = 13; // Cost basis per share
  common.v1.Money           current_price               = 14;
  common.v1.Money           market_value_base           = 15;
  common.v1.Money           unrealized_pnl_base         = 16;
  common.v1.Decimal         unrealized_pnl_percent      = 17;
  int32                     holding_period_days         = 18;
  HoldingTermClassification term_classification         = 19;
  bool                      is_cgt_discount_eligible    = 20;
  bool                      is_loss_harvesting_candidate = 21;
  bool                      has_wash_sale_risk          = 22;
}

message ListTaxLotsRequest {
  string          user_id       = 1;
  optional string instrument_id = 2; // Optional filter by ticker / asset
  TaxLotStatus    status        = 3; // OPEN, CLOSED, or ALL
}

message ListTaxLotsResponse {
  repeated TaxLotItem tax_lots = 1;
}

message RealizedDisposalItem {
  string                    disposal_id                 = 1;
  string                    tax_lot_id                  = 2;
  string                    sell_transaction_id         = 3;
  string                    instrument_id               = 4;
  string                    ticker                      = 5;
  string                    name                        = 6;
  string                    acquired_date               = 7;  // YYYY-MM-DD
  string                    disposed_date               = 8;  // YYYY-MM-DD
  common.v1.Decimal         quantity_disposed           = 9;
  common.v1.Money           cost_basis_relieved_base    = 10;
  common.v1.Money           proceeds_base               = 11;
  common.v1.Money           realized_pnl_base           = 12;
  common.v1.Decimal         realized_pnl_percent        = 13;
  int32                     holding_period_days         = 14;
  HoldingTermClassification term_classification         = 15;
  bool                      is_cgt_discount_eligible    = 16;
  common.v1.Money           discounted_taxable_pnl_base = 17; // 50% discount if eligible
}

message TaxableIncomeSummary {
  common.v1.Money   dividend_and_interest_income = 1;
  common.v1.Money   net_capital_gains            = 2;
  common.v1.Money   franking_credits             = 3;
  common.v1.Money   total_assessable_income      = 4;
  common.v1.Decimal dividend_interest_ratio_pct  = 5; // e.g. 48.44%
  common.v1.Decimal capital_gains_ratio_pct      = 6; // e.g. 46.66%
  common.v1.Decimal franking_credits_ratio_pct   = 7; // e.g. 4.90%
}

message CapitalGainsSummary {
  common.v1.Money   total_capital_gains          = 1;
  common.v1.Money   losses_applied               = 2;
  common.v1.Money   cgt_discount_amount          = 3; // 50% discount for eligible long-term
  common.v1.Money   net_capital_gain             = 4;
  common.v1.Decimal cgt_discount_rate_pct        = 5; // e.g. 50.0%
  int32             gain_disposals_count         = 6;
  int32             loss_disposals_count         = 7;
}

message TaxOffsetsSummary {
  common.v1.Money   franking_credits_offset      = 1; // Available refundable imputation offset
  common.v1.Money   foreign_tax_offsets          = 2; // Available non-refundable foreign withholding offset (FITO)
  common.v1.Money   total_available_offsets      = 3;
}

message TaxReportSummary {
  TaxableIncomeSummary taxable_income            = 1;
  CapitalGainsSummary  capital_gains             = 2;
  TaxOffsetsSummary    tax_offsets               = 3;
  string               fiscal_year_label         = 4; // e.g. "FY2025-2026"
  string               base_currency             = 5;
}

message GetTaxReportRequest {
  string          user_id      = 1;
  optional int32  fiscal_year  = 2; // e.g. 2026
  optional string from_date    = 3; // YYYY-MM-DD
  optional string to_date      = 4; // YYYY-MM-DD
}

message GetTaxReportResponse {
  TaxReportSummary              summary              = 1;
  repeated RealizedDisposalItem disposals            = 2;
  repeated TaxLotItem           open_lots            = 3;
  string                        from_date            = 4;
  string                        to_date              = 5;
  string                        fiscal_year_label    = 6;
  string                        base_currency        = 7;
}

message RealizedGainsSummary {
  common.v1.Money   total_proceeds_base         = 1;
  common.v1.Money   total_cost_basis_relieved   = 2;
  common.v1.Money   gross_realized_gains_base   = 3;
  common.v1.Money   gross_realized_losses_base  = 4;
  common.v1.Money   net_realized_pnl_base       = 5;
  common.v1.Money   short_term_gains_base       = 6;
  common.v1.Money   long_term_gains_base        = 7;
  common.v1.Money   discounted_taxable_gain_base = 8;
  int32             total_disposal_count        = 9;
}

message GetRealizedGainsReportRequest {
  string          user_id     = 1;
  optional string from_date   = 2; // YYYY-MM-DD
  optional string to_date     = 3; // YYYY-MM-DD
  optional int32  fiscal_year = 4; // e.g. 2025 (FY25)
}

message GetRealizedGainsReportResponse {
  RealizedGainsSummary          summary       = 1;
  repeated RealizedDisposalItem disposals     = 2;
  string                        from_date     = 3;
  string                        to_date       = 4;
  string                        base_currency = 5;
}





