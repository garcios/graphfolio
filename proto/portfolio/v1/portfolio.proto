syntax = "proto3";

package portfolio.v1;

import "common/v1/decimal.proto";

option go_package = "graphfolio/proto/portfolio/v1;portfoliopb";

service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse) {}
  rpc UpdatePortfolioBaseCurrency(UpdatePortfolioBaseCurrencyRequest) returns (UpdatePortfolioBaseCurrencyResponse) {}
  rpc AddTransaction(AddTransactionRequest) returns (AddTransactionResponse) {}
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse) {}
  rpc GetPortfolioHistory(GetPortfolioHistoryRequest) returns (GetPortfolioHistoryResponse) {}
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {}
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse) {}

  // Admin: Asset Directory Management
  rpc ListAllInstruments(ListAllInstrumentsRequest) returns (ListAllInstrumentsResponse) {}
  rpc CreateInstrument(CreateInstrumentRequest) returns (CreateInstrumentResponse) {}
  rpc UpdateInstrument(UpdateInstrumentRequest) returns (UpdateInstrumentResponse) {}

  // Admin: Closing Price Management & Overrides
  rpc ListInstrumentPrices(ListInstrumentPricesRequest) returns (ListInstrumentPricesResponse) {}
  rpc RecordPriceOverride(RecordPriceOverrideRequest) returns (RecordPriceOverrideResponse) {}

  // Admin: Ingestion Pipeline & Diagnostics
  rpc GetIngestionStatus(GetIngestionStatusRequest) returns (GetIngestionStatusResponse) {}
  rpc TriggerMarketSync(TriggerMarketSyncRequest) returns (TriggerMarketSyncResponse) {}

  // Admin: FX Rates & Currency Pair Inspection
  rpc ListCurrencyPairs(ListCurrencyPairsRequest) returns (ListCurrencyPairsResponse) {}
  rpc ListFXRates(ListFXRatesRequest) returns (ListFXRatesResponse) {}
  rpc GetCurrencyPairHistory(GetCurrencyPairHistoryRequest) returns (GetCurrencyPairHistoryResponse) {}
  rpc RecordFXRateOverride(RecordFXRateOverrideRequest) returns (RecordFXRateOverrideResponse) {}

  // Admin: Historical Market Data Backfill
  rpc TriggerBackfill(TriggerBackfillRequest) returns (TriggerBackfillResponse) {}

  // Historical Valuation Engine & Replay
  rpc RebuildValuations(RebuildValuationsRequest) returns (RebuildValuationsResponse) {}
}

message RebuildValuationsRequest {
  string user_id   = 1;
  string from_date = 2; // Optional: YYYY-MM-DD
}

message RebuildValuationsResponse {
  bool   success = 1;
  string message = 2;
}

message GetPortfolioRequest {
  string user_id = 1;
}

message GetPortfolioResponse {
  Portfolio portfolio = 1;
}

message UpdatePortfolioBaseCurrencyRequest {
  string user_id       = 1;
  string base_currency = 2; // e.g. "AUD"
}

message UpdatePortfolioBaseCurrencyResponse {
  Portfolio portfolio = 1;
}

enum TransactionType {
  TRANSACTION_TYPE_UNSPECIFIED = 0;
  TRANSACTION_TYPE_BUY = 1;
  TRANSACTION_TYPE_SELL = 2;
  TRANSACTION_TYPE_DIVIDEND = 3;
  TRANSACTION_TYPE_DEPOSIT = 4;
  TRANSACTION_TYPE_WITHDRAWAL = 5;
  TRANSACTION_TYPE_INTEREST = 6;
  TRANSACTION_TYPE_FEE = 7;
  TRANSACTION_TYPE_TAX = 8;
  TRANSACTION_TYPE_TRANSFER_IN = 9;
  TRANSACTION_TYPE_TRANSFER_OUT = 10;
  TRANSACTION_TYPE_FX_CONVERSION = 11;
}

message AddTransactionRequest {
  string            user_id    = 1;
  TransactionType   type       = 2;
  string            symbol     = 3; // e.g. "AAPL" (optional for DEPOSIT/WITHDRAWAL)
  string            trade_date = 4; // YYYY-MM-DD
  common.v1.Decimal quantity   = 5; // e.g. "10"
  common.v1.Money   price      = 6; // unit price
  common.v1.Money   amount     = 7; // total cash flow / value
  common.v1.Money   fee        = 8; // optional fee
  string            notes      = 9;
}

message AddTransactionResponse {
  string    transaction_id = 1;
  Portfolio portfolio      = 2;
}

message Instrument {
  string id            = 1;
  string symbol        = 2;
  string name          = 3;
  string currency_code = 4;
  string asset_class   = 5;
  string exchange_code = 6;
  string isin          = 7;
  bool   is_active     = 8;
}

message ListInstrumentsRequest {}

message ListInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message Portfolio {
  common.v1.Money   total_value               = 1;
  common.v1.Money   today_return_amount       = 2;
  common.v1.Decimal today_return_percent      = 3;
  common.v1.Decimal annualized_return_percent = 4;
  common.v1.Money   cash_balance              = 5;
  repeated Investment investments             = 6;
}

message Investment {
  string            id                   = 1;
  string            ticker               = 2;
  string            name                 = 3;
  common.v1.Money   price                = 4;
  common.v1.Decimal quantity             = 5;
  common.v1.Money   total_value          = 6;
  common.v1.Money   today_return_amount  = 7;
  common.v1.Decimal today_return_percent = 8;
  common.v1.Money   total_return_amount  = 9;
  common.v1.Decimal total_return_percent = 10;
}

enum HistoryTimeframe {
  HISTORY_TIMEFRAME_UNSPECIFIED = 0;
  HISTORY_TIMEFRAME_1D = 1;
  HISTORY_TIMEFRAME_1W = 2;
  HISTORY_TIMEFRAME_1M = 3;
  HISTORY_TIMEFRAME_1Y = 4;
  HISTORY_TIMEFRAME_ALL = 5;
}

message ValuationPoint {
  string            date         = 1; // YYYY-MM-DD
  common.v1.Money   total_value  = 2; // Market value + cash value
  common.v1.Money   market_value = 3;
  common.v1.Money   cash_value   = 4;
  common.v1.Decimal twr_index    = 5;
  common.v1.Decimal daily_return = 6;
}

message GetPortfolioHistoryRequest {
  string           user_id   = 1;
  HistoryTimeframe timeframe = 2;
}

message GetPortfolioHistoryResponse {
  repeated ValuationPoint points         = 1;
  common.v1.Money         start_value    = 2;
  common.v1.Money         end_value      = 3;
  common.v1.Money         return_amount  = 4;
  common.v1.Decimal       return_percent = 5;
}

message TransactionItem {
  string            id              = 1;
  TransactionType   type            = 2;
  string            symbol          = 3; // empty for cash events
  string            instrument_name = 4;
  string            trade_date      = 5; // YYYY-MM-DD
  common.v1.Decimal quantity        = 6; // nullable
  common.v1.Money   price           = 7; // nullable
  common.v1.Money   amount          = 8;
  common.v1.Money   fee             = 9;
  string            notes           = 10;
  string            created_at      = 11;
}

message ListTransactionsRequest {
  string          user_id   = 1;
  TransactionType type      = 2; // optional filter (0 = all)
  string          symbol    = 3; // optional symbol filter
  int32           page      = 4; // 1-indexed, default 1
  int32           page_size = 5; // default 20, max 100
}

message ListTransactionsResponse {
  repeated TransactionItem transactions = 1;
  int32                    total_count  = 2;
  int32                    page         = 3;
  int32                    page_size    = 4;
}

message DeleteTransactionRequest {
  string user_id        = 1;
  string transaction_id = 2;
}

message DeleteTransactionResponse {
  bool      success   = 1;
  Portfolio portfolio = 2; // Recomputed portfolio metrics
}

// ------------------------------------------------------------------
// Admin: Asset Directory Messages
// ------------------------------------------------------------------

message ListAllInstrumentsRequest {
  optional bool   is_active = 1;
  optional string search    = 2;
}

message ListAllInstrumentsResponse {
  repeated Instrument instruments = 1;
}

message CreateInstrumentRequest {
  string          symbol        = 1; // e.g. "NVDA"
  string          exchange_code = 2; // e.g. "XNAS"
  string          name          = 3; // e.g. "NVIDIA Corporation"
  string          asset_class   = 4; // e.g. "EQUITY", "ETF", "CRYPTO"
  string          currency_code = 5; // e.g. "USD"
  optional string isin          = 6; // e.g. "US67066G1040"
}

message CreateInstrumentResponse {
  Instrument instrument = 1;
}

message UpdateInstrumentRequest {
  string          id        = 1; // Instrument UUID
  optional string name      = 2;
  optional bool   is_active = 3;
  optional string isin      = 4;
}

message UpdateInstrumentResponse {
  Instrument instrument = 1;
}

// ------------------------------------------------------------------
// Admin: Price Management Messages
// ------------------------------------------------------------------

message InstrumentPriceItem {
  string          instrument_id = 1;
  string          symbol        = 2;
  string          price_date    = 3; // YYYY-MM-DD
  common.v1.Money price         = 4; // Unit close price + currency
  string          source        = 5; // e.g. "TWELVE_DATA", "MANUAL_OVERRIDE"
  string          updated_at    = 6; // ISO 8601 timestamp
}

message ListInstrumentPricesRequest {
  optional string symbol    = 1;
  optional string from_date = 2; // YYYY-MM-DD
  optional string to_date   = 3; // YYYY-MM-DD
  int32           limit     = 4; // Default 50, max 200
  int32           offset    = 5;
}

message ListInstrumentPricesResponse {
  repeated InstrumentPriceItem prices      = 1;
  int32                        total_count = 2;
}

message RecordPriceOverrideRequest {
  string            symbol               = 1;
  string            price_date           = 2; // YYYY-MM-DD
  common.v1.Decimal price                = 3; // Exact override price
  optional string   reason               = 4; // Audit note
  bool              recompute_valuations = 5; // Trigger retroactive portfolio valuation update
}

message RecordPriceOverrideResponse {
  InstrumentPriceItem price                 = 1;
  bool                valuations_recomputed = 2;
}

// ------------------------------------------------------------------
// Admin: Ingestion Pipeline & Diagnostics Messages
// ------------------------------------------------------------------

message FeedHealthStatus {
  string name     = 1;
  string status   = 2;
  string provider = 3;
  string schedule = 4;
  string last_run = 5;
  string details  = 6;
}

message GetIngestionStatusRequest {}

message GetIngestionStatusResponse {
  repeated FeedHealthStatus feeds                 = 1;
  int32                     tracked_instruments   = 2;
  int32                     tracked_currencies    = 3;
  string                    latest_price_date     = 4;
  string                    latest_fx_date        = 5;
  int32                     rate_limit_remaining  = 6;
  int32                     rate_limit_budget     = 7;
  int32                     pending_backfill_jobs = 8;
}

message TriggerMarketSyncRequest {
  repeated string symbols = 1;
  bool            sync_fx = 2;
}

message TriggerMarketSyncResponse {
  bool   success         = 1;
  int32  prices_synced   = 2;
  int32  fx_rates_synced = 3;
  string message         = 4;
}

// ------------------------------------------------------------------
// Admin: Foreign Exchange (FX) & Currency Pair Messages
// ------------------------------------------------------------------

message CurrencyPairItem {
  string            base_currency    = 1;
  string            quote_currency   = 2;
  common.v1.Decimal latest_rate      = 3;
  string            latest_date      = 4; // YYYY-MM-DD
  string            latest_source    = 5;
  common.v1.Decimal previous_rate    = 6; // nullable
  common.v1.Decimal change_1d_amount = 7; // nullable
  common.v1.Decimal change_1d_pct    = 8; // nullable
  int32             total_records    = 9;
  string            first_date       = 10;
  string            last_date        = 11;
}

message ListCurrencyPairsRequest {}

message ListCurrencyPairsResponse {
  repeated CurrencyPairItem pairs = 1;
}

message FXRateItem {
  string            base_currency  = 1;
  string            quote_currency = 2;
  string            rate_date      = 3; // YYYY-MM-DD
  common.v1.Decimal rate           = 4;
  common.v1.Decimal inverted_rate  = 5; // 1 / rate (exact 10 decimals)
  string            source         = 6;
}

message ListFXRatesRequest {
  optional string base_currency  = 1;
  optional string quote_currency = 2;
  optional string from_date      = 3; // YYYY-MM-DD
  optional string to_date        = 4; // YYYY-MM-DD
  int32           limit          = 5; // Default 50, max 200
  int32           offset         = 6;
}

message ListFXRatesResponse {
  repeated FXRateItem rates       = 1;
  int32               total_count = 2;
}

message FXHistoryPoint {
  string            date          = 1; // YYYY-MM-DD
  common.v1.Decimal rate          = 2;
  common.v1.Decimal inverted_rate = 3;
  string            source        = 4;
}

message GetCurrencyPairHistoryRequest {
  string           base_currency  = 1;
  string           quote_currency = 2;
  HistoryTimeframe timeframe      = 3; // 1D, 1W, 1M, 1Y, ALL
}

message GetCurrencyPairHistoryResponse {
  string                  base_currency     = 1;
  string                  quote_currency    = 2;
  repeated FXHistoryPoint points            = 3;
  common.v1.Decimal       start_rate        = 4;
  common.v1.Decimal       end_rate          = 5;
  common.v1.Decimal       period_change     = 6;
  common.v1.Decimal       period_change_pct = 7;
  common.v1.Decimal       period_high       = 8;
  common.v1.Decimal       period_low        = 9;
}

message RecordFXRateOverrideRequest {
  string            base_currency        = 1;
  string            quote_currency       = 2;
  string            rate_date            = 3; // YYYY-MM-DD
  common.v1.Decimal rate                 = 4; // Greater than zero
  optional string   reason               = 5; // Audit note
  bool              recompute_valuations = 6;
}

message RecordFXRateOverrideResponse {
  FXRateItem rate                  = 1;
  bool       valuations_recomputed = 2;
}

message TriggerBackfillRequest {
  string          from_date            = 1; // YYYY-MM-DD (inclusive start date)
  string          to_date              = 2; // YYYY-MM-DD (inclusive end date, defaults to today)
  repeated string symbols              = 3; // Optional list of ticker symbols. If empty & backfill_assets=true, all active instruments are backfilled.
  repeated string currency_pairs       = 4; // Optional list of currency pairs (e.g. "EUR/USD"). If empty & backfill_fx=true, standard pairs are backfilled.
  bool            backfill_assets      = 5; // Whether to backfill equity/ETF/fund closing prices
  bool            backfill_fx          = 6; // Whether to backfill foreign exchange reference rates
  bool            recompute_valuations = 7; // Whether to recompute affected portfolio historical valuations
}

message TriggerBackfillResponse {
  bool            success         = 1;
  int32           prices_synced   = 2;
  int32           fx_rates_synced = 3;
  string          message         = 4;
  repeated string warnings        = 5;
}


